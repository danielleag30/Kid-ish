:root {
  --bg:       #0b2113;
  --bg2:      #103019;
  --bg3:      #173d22;
  --card:     #1c4a29;
  --card2:    #245c33;
  --border:   #3a7a45;
  --leaf:     #8fe06a;
  --moss:     #b6e8a0;
  --bark:     #c99a5b;
  --sun:      #ffe27a;
  --gold:     #ffd24a;
  --amber:    #ff9b42;
  --text:     #e6f6e0;
  --text-dim: #a8cfa0;

  --shadow:   #b585f5;
  --wind:     #ecd35e;
  --river:    #44b4ff;

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }

#app { position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column;

.nav-link { display:inline-block; background:var(--card2); border:2px solid var(--border); color:var(--moss); text-decoration:none; border-radius:999px; padding:8px 18px; font-size:15px; font-weight:bold; transition:transform .15s, background .2s; }

.series-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }

.char-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:18px; margin-bottom:24px; }

.char-card { background:linear-gradient(180deg,var(--card),var(--bg3)); border:2px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-card); overflow:hidden; display:flex; flex-direction:column; transition:transform .15s; }

.char-card[data-clan="wind"]    .clan-bar { background:var(--wind); }
.char-card[data-clan="river"]   .clan-bar { background:var(--river); }

.char-card[data-clan="bloodclan"] .clan-bar { background:var(--bloodclan); }

.card-body { padding:16px; flex:1; display:flex; flex-direction:column; gap:11px; }
.card-header { display:flex; align-items:center; gap:12px; }
.avatar { position:relative; flex:none; width:56px; height:56px; }

.avatar .clan-dot { position:absolute; right:-4px; bottom:-4px; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; background:var(--bg3); border:2px solid var(--border); }
.char-names { flex:1; min-width:0; }
.char-name { font-size:clamp(18px,2.8vw,22px); color:#fff; font-weight:800; line-height:1.15; }
.char-former { font-size:12px; color:var(--text-dim); margin-top:2px; }
.char-rank { display:inline-block; background:var(--bg3); border:2px solid var(--border); border-radius:999px; padding:3px 11px; font-size:12px; color:var(--moss); font-weight:bold; white-space:nowrap; align-self:flex-start; margin-top:3px; }

.power { background:linear-gradient(100deg,var(--gold),var(--amber)); color:#2a1500; border-radius:14px; padding:10px 13px; font-weight:800; font-size:14.5px; line-height:1.35; box-shadow:0 0 16px rgba(255,210,74,.35); display:flex; gap:8px; align-items:flex-start; }

.line { font-size:14.5px; line-height:1.5; -webkit-user-select:text; user-select:text; }

.bond { font-size:13.5px; color:var(--text); display:flex; gap:8px; align-items:flex-start; }
.bond .be { flex:none; font-size:15px; }
.bond .bk { color:var(--moss); font-weight:bold; }
.bond .bv { -webkit-user-select:text; user-select:text; }

.qa-section { margin-top:2px; }
.qa-toggle { width:100%; background:var(--leaf); border:none; border-radius:12px; color:#0a2410; font-family:inherit; font-size:14px; font-weight:800; padding:10px 12px; text-align:left; cursor:pointer; display:flex; align-items:center; gap:6px; transition:transform .12s; }
.qa-toggle:active { transform:scale(.97); }
.qa-toggle .chevron { margin-left:auto; transition:transform .2s; }
.qa-toggle.open .chevron { transform:rotate(180deg); }
.qa-items { display:none; flex-direction:column; gap:8px; padding:10px 0 0; }
.qa-items.open { display:flex; }
.qa-item { background:var(--bg3); border:2px solid var(--border); border-radius:12px; padding:11px 12px; }
.qa-question { font-size:13.5px; color:#fff; font-weight:bold; line-height:1.4; margin-bottom:7px; -webkit-user-select:text; user-select:text; }
.qa-reveal-btn { background:var(--card2); border:2px dashed var(--border); border-radius:8px; color:var(--moss); font-family:inherit; font-size:12.5px; font-weight:bold; padding:6px 11px; cursor:pointer; width:100%; text-align:left; }

.qa-answer.shown { display:block; }

.storyline-section { margin-bottom:40px; }
.section-heading { font-size:clamp(20px,3.4vw,28px); color:#fff; border-bottom:2px dashed var(--border); padding-bottom:10px; margin-bottom:16px; }
.arc-block { background:linear-gradient(180deg,var(--card),var(--bg3)); border:2px solid var(--border); border-radius:var(--radius); margin-bottom:14px; overflow:hidden; }
.arc-toggle { width:100%; background:none; border:none; color:#fff; font-family:inherit; font-size:clamp(16px,2.4vw,19px); font-weight:800; padding:16px 18px; text-align:left; cursor:pointer; display:flex; align-items:center; gap:10px; }

.arc-toggle .arc-chev { margin-left:auto; color:var(--moss); transition:transform .2s; }

.arc-content.open { display:block; }
.arc-summary { font-size:15px; color:var(--text); line-height:1.6; margin:14px 0 16px; -webkit-user-select:text; user-select:text; }
.parent-qs-label { font-size:13px; color:var(--moss); font-weight:800; margin-bottom:10px; }
.parent-q-item { background:var(--bg3); border:2px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
.parent-q-text { font-size:14px; color:#fff; font-weight:bold; margin-bottom:8px; line-height:1.4; -webkit-user-select:text; user-select:text; }
.parent-a-btn { background:var(--card2); border:2px dashed var(--border); border-radius:8px; color:var(--moss); font-family:inherit; font-size:13px; font-weight:bold; padding:6px 12px; cursor:pointer; }
.parent-a-btn:active { transform:scale(.97); }
.parent-a-text { display:none; margin-top:7px; font-size:13.5px; color:#2a1500; line-height:1.5; padding:8px 10px; background:var(--sun); border-radius:8px; font-weight:600; -webkit-user-select:text; user-select:text; }
.parent-a-text.shown { display:block; }

footer { text-align:center; color:var(--moss); font-size:13px; padding:20px 0 10px; border-top:2px dashed var(--border); font-weight:bold; }

/* ── Floating Fun button ── */

</style>

function bondEmoji(key){
  const k = key.toLowerCase();
  if (k.includes("mate")||k.includes("love")) return "💞";
  if (k.includes("kit")||k.includes("raised")) return "👶";
  if (k.includes("best")) return "🤝";
  if (k.includes("mentor")||k.includes("apprentice")) return "🎓";
  if (k.includes("enemy")||k.includes("rival")||k.includes("kill")||k.includes("tried")) return "⚔️";
  if (k.includes("brother")||k.includes("sister")||k.includes("sibling")) return "👯";
  if (k.includes("father")||k.includes("mother")||k.includes("parent")||k.includes("son")||k.includes("daughter")) return "👨‍👩‍👧";
  if (k.includes("leader")) return "👑";
  if (k.includes("secret")) return "🤫";
  if (k.includes("close")||k.includes("friend")) return "💚";
  if (k.includes("group")||k.includes("loyal")) return "🏚️";
  return "🔗";
}

/* ════════ RENDER ════════ */
let activeSeries = "all";

function buildCharCard(char) {
  const formerHtml = char.was?.length ? `<div class="char-former">was: ${char.was.join(" → ")}</div>` : "";
  const powerHtml = char.power ? `<div class="power"><span class="bolt">⚡</span><span>${char.power}</span></div>` : "";
  const bondsHtml = Object.entries(char.bonds || {}).map(([k,v]) =>
    `<div class="bond"><span class="be">${bondEmoji(k)}</span><span><span class="bk">${k}:</span> <span class="bv">${v}</span></span></div>`
  ).join("");
  const safe = char.name.replace(/[^a-zA-Z0-9]/g,"_");
  const qHtml = (char.quiz||[]).map((qa,i) => `
    <div class="qa-item">
      <div class="qa-question">❓ ${qa.q}</div>
      <button class="qa-reveal-btn" data-qid="${safe}::${i}">👀 Tap to see the answer!</button>
      <div class="qa-answer" id="qa-${safe}-${i}">${qa.a}</div>
    </div>`).join("");
  const qaSection = qHtml ? `
    <div class="qa-section">
      <button class="qa-toggle" data-charkey="${safe}">🧠 Quiz Me! <span class="chevron">▾</span></button>
      <div class="qa-items" id="qai-${safe}">${qHtml}</div>
    </div>` : "";

  return `
    <div class="char-card" data-clan="${char.clan}">
      <div class="clan-bar"></div>
      <div class="card-body">
        <div class="card-header">
          <div class="avatar">
            <div class="face" style="background:${char.pelt||'#888'}">🐱</div>
            <div class="clan-dot">${CLAN_EMOJI[char.clan] || "🐾"}</div>
          </div>
          <div class="char-names">
            <div class="char-name">${char.name}</div>
            ${formerHtml}
            <span class="char-rank">${char.rank}</span>
          </div>
        </div>
        ${powerHtml}
        <div class="line look">👀 ${char.look}</div>
        <div class="line story">${char.story}</div>
        ${bondsHtml ? `<div class="line"><span class="lbl">🔗 Connected to:</span></div><div class="bonds">${bondsHtml}</div>` : ""}
        ${qaSection}
      </div>
    </div>`;
}

function renderSeries() {
  const container = document.getElementById("series-container");
  container.innerHTML = "";
  const toShow = activeSeries === "all" ? GN_SERIES : GN_SERIES.filter(s => s.id === activeSeries);

  toShow.forEach(series => {
    const block = document.createElement("section");
    block.className = "series-block";
    const volPills = series.volumes.map(v => `<span class="vol-pill">📘 ${v}</span>`).join("");
    const cardHtml = series.characters.map(c => buildCharCard(c)).join("");
    block.innerHTML = `
      <h2 class="series-heading">${series.emoji} ${series.title}</h2>
      <div class="series-meta">📚 ${series.volumes.length} book${series.volumes.length !== 1 ? "s" : ""}</div>
      <div class="vol-pills">${volPills}</div>
      <div class="series-summary">${series.description}</div>
      <div class="char-grid">${cardHtml}</div>`;
    container.appendChild(block);
  });

  container.querySelectorAll(".qa-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const items = document.getElementById("qai-" + btn.dataset.charkey);
      btn.classList.toggle("open", items.classList.toggle("open"));
    });
  });
  container.querySelectorAll(".qa-reveal-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const [safe, idx] = btn.dataset.qid.split("::");
      const ans = document.getElementById("qa-" + safe + "-" + idx);
      if (!ans) return;
      btn.textContent = ans.classList.toggle("shown") ? "🙈 Hide the answer" : "👀 Tap to see the answer!";
    });
  });
}

function renderStorylines() {
  const container = document.getElementById("arc-blocks");
  STORYLINES.forEach(story => {
    const block = document.createElement("div");
    block.className = "arc-block";
    const pqHtml = story.parentQuestions.map((pq,i) => `
      <div class="parent-q-item">
        <div class="parent-q-text">💬 ${pq.q}</div>
        <button class="parent-a-btn" data-arc="${story.id}" data-idx="${i}">👀 Show the answer</button>
        <div class="parent-a-text" id="pq-${story.id}-${i}">${pq.a}</div>
      </div>`).join("");
    block.innerHTML = `
      <button class="arc-toggle" data-arc="${story.id}">${story.emoji} ${story.name} <span class="arc-chev">▾</span></button>
      <div class="arc-content" id="arc-content-${story.id}">
        <div class="arc-summary">${story.summary}</div>
        <div class="parent-qs-label">💬 Talk About It!</div>
        ${pqHtml}
      </div>`;
    container.appendChild(block);
  });
  container.querySelectorAll(".arc-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const content = document.getElementById("arc-content-" + btn.dataset.arc);
      btn.classList.toggle("open", content.classList.toggle("open"));
    });
  });
  container.querySelectorAll(".parent-a-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const el = document.getElementById(`pq-${btn.dataset.arc}-${btn.dataset.idx}`);
      if (!el) return;
      btn.textContent = el.classList.toggle("shown") ? "🙈 Hide the answer" : "👀 Show the answer";
    });
  });
}

document.getElementById("seriesTabs").addEventListener("click", e => {
  const tab = e.target.closest(".series-tab");
  if (!tab) return;
  document.querySelectorAll(".series-tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  activeSeries = tab.dataset.series;
  renderSeries();
});

renderSeries();
renderStorylines();
</script>
